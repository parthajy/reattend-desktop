name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        run: npx tauri build --config "{\"bundle\":{\"resources\":[]}}"
        env:
          RUST_BACKTRACE: 1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: reattend-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload NSIS signature
        uses: actions/upload-artifact@v4
        with:
          name: reattend-windows-installer-sig
          path: src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: ignore

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: reattend-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore
