name: Release

# Tag-triggered cross-platform release workflow.
#
# On `git push origin v0.1.14` (or any tag matching v*), this workflow:
#   1. Builds the desktop app on macOS (Apple silicon, signed + notarized)
#   2. Builds on Windows (x86_64, NSIS installer)
#   3. Publishes a GitHub Release with both artifacts
#   4. Writes data/updater/latest.json on the droplet so existing installs
#      auto-update via /api/updater/{target}/{arch}/{current_version}
#   5. Uploads the .app.zip + .msi to /var/www/enterprise/public/downloads/
#      so the in-dashboard /app/downloads page links work
#
# Required GitHub repo secrets (Settings → Secrets → Actions):
#
#   APPLE_CERTIFICATE              base64 of the Developer ID Application .p12 export
#                                  (Keychain Access → My Certificates → right-click Export → .p12;
#                                   then `base64 -i cert.p12 | pbcopy`)
#   APPLE_CERTIFICATE_PASSWORD     password used during the .p12 export
#   APPLE_SIGNING_IDENTITY         "Developer ID Application: Partha Borthakur (6AKUD88CVN)"
#   APPLE_ID                       parthajy@gmail.com (or whichever Apple ID owns the cert)
#   APPLE_PASSWORD                 app-specific password from appleid.apple.com → Sign-In → App-Specific Passwords
#   APPLE_TEAM_ID                  6AKUD88CVN
#
#   TAURI_SIGNING_PRIVATE_KEY      already used by build-windows.yml; re-used here
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#
#   DEPLOY_HOST                    167.99.158.143
#   DEPLOY_KEY                     SSH private key (paste the *contents* of your local
#                                  ~/.ssh/id_ed25519 or whichever key has root@ on the droplet)
#
# Cutting a release:
#   1. Bump `version` in src-tauri/tauri.conf.json
#   2. Bump `LATEST_VERSION` in enterprise/src/app/(app)/app/downloads/page.tsx
#   3. git commit && git push
#   4. git tag v0.1.14 && git push origin v0.1.14
#   The workflow runs ~12 minutes; new release appears, droplet auto-syncs.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.1.14) — only used for manual runs'
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci || npm install

      # Windows can't bundle the macOS Swift helper binary; strip the
      # `bundle.resources` array so tauri build doesn't try.
      - name: Strip macOS resources (Windows only)
        if: matrix.platform == 'windows-latest'
        run: node -e "const f='src-tauri/tauri.conf.json';const c=JSON.parse(require('fs').readFileSync(f));delete c.bundle.resources;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
        shell: bash

      # macOS-only: build the Swift OCR helper (referenced by tauri.conf.json
      # bundle.resources) before tauri build runs.
      - name: Build Swift helper (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          cd src-tauri/swift-plugin
          swift build -c release
        shell: bash

      - name: Setup MSVC Developer Environment (Windows only)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build, sign, notarize via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple signing + notarization (macOS-only; Windows ignores)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri updater signing (both platforms)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name || inputs.tag }}
          releaseName: 'Reattend ${{ github.ref_name || inputs.tag }}'
          releaseBody: |
            Auto-generated release. The desktop app auto-updates via
            `/api/updater/{target}/{arch}/{current_version}`; existing
            installs pick this up on next launch.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  publish-manifest:
    name: Publish updater manifest + sync droplet
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: echo "name=${GITHUB_REF_NAME:-${{ inputs.tag }}}" >> $GITHUB_OUTPUT

      - name: Download release assets via gh CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh release download "${{ steps.tag.outputs.name }}" \
            --pattern '*.app.tar.gz' \
            --pattern '*.app.tar.gz.sig' \
            --pattern '*.msi' \
            --pattern '*.msi.zip' \
            --pattern '*.msi.zip.sig' \
            --pattern '*.nsis.zip' \
            --pattern '*.nsis.zip.sig' \
            --dir artifacts
          ls -la artifacts/

      - name: Build updater manifest
        id: manifest
        run: |
          # Strip leading 'v' from the tag — Tauri's updater expects a
          # semver-shaped version string, no prefix.
          VERSION="${{ steps.tag.outputs.name }}"
          VERSION="${VERSION#v}"

          # Resolve the (sig, archive) pair per platform. Tauri produces:
          #   macOS:   *.app.tar.gz + *.app.tar.gz.sig    (signed by TAURI_SIGNING_PRIVATE_KEY)
          #   Windows: *.nsis.zip + *.nsis.zip.sig (preferred for updater)
          DARWIN_ARCHIVE=$(find artifacts -name '*.app.tar.gz' ! -name '*.sig' | head -1)
          DARWIN_SIG_FILE=$(find artifacts -name '*.app.tar.gz.sig' | head -1)
          WIN_ARCHIVE=$(find artifacts -name '*.nsis.zip' ! -name '*.sig' | head -1)
          WIN_SIG_FILE=$(find artifacts -name '*.nsis.zip.sig' | head -1)

          DARWIN_SIG=""
          WIN_SIG=""
          [ -n "$DARWIN_SIG_FILE" ] && DARWIN_SIG=$(cat "$DARWIN_SIG_FILE")
          [ -n "$WIN_SIG_FILE" ] && WIN_SIG=$(cat "$WIN_SIG_FILE")

          # The base URLs the manifest hands to clients. We mirror to
          # /var/www/enterprise/public/downloads/ in the next step so
          # these resolve.
          DARWIN_FILE=$(basename "$DARWIN_ARCHIVE" 2>/dev/null || echo "")
          WIN_FILE=$(basename "$WIN_ARCHIVE" 2>/dev/null || echo "")

          PLATFORMS="{}"
          if [ -n "$DARWIN_FILE" ] && [ -n "$DARWIN_SIG" ]; then
            PLATFORMS=$(jq -n \
              --arg url "https://reattend.com/downloads/$DARWIN_FILE" \
              --arg sig "$DARWIN_SIG" \
              '{"darwin-aarch64": {"signature": $sig, "url": $url}}')
          fi
          if [ -n "$WIN_FILE" ] && [ -n "$WIN_SIG" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq \
              --arg url "https://reattend.com/downloads/$WIN_FILE" \
              --arg sig "$WIN_SIG" \
              '. + {"windows-x86_64": {"signature": $sig, "url": $url}}')
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg notes "Reattend ${{ steps.tag.outputs.name }} — see release notes on GitHub." \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > latest.json
          cat latest.json

      - name: Download installers (.app.zip + .msi) for static hosting
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.tag.outputs.name }}" \
            --pattern '*.app.zip' \
            --pattern '*.exe' \
            --pattern '*.msi' \
            --dir artifacts/installers
          ls -la artifacts/installers/ || true

      - name: Sync artifacts + manifest to droplet
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          echo "$DEPLOY_KEY" > deploy_key
          chmod 600 deploy_key
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Mirror updater archives + installers into public/downloads/.
          # The /app/downloads page links by exact filename, and the
          # updater manifest URLs point here too.
          scp -i deploy_key -o StrictHostKeyChecking=no -r \
            artifacts/* \
            "root@${DEPLOY_HOST}:/var/www/enterprise/public/downloads/"

          # The /api/updater route reads data/updater/latest.json — drop
          # the freshly-built manifest into place.
          ssh -i deploy_key -o StrictHostKeyChecking=no \
            "root@${DEPLOY_HOST}" \
            "mkdir -p /var/www/enterprise/data/updater"
          scp -i deploy_key -o StrictHostKeyChecking=no \
            latest.json \
            "root@${DEPLOY_HOST}:/var/www/enterprise/data/updater/latest.json"
