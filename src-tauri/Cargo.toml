[package]
name = "reattend-desktop"
version = "0.1.0"
description = "Reattend Desktop — ambient memory layer"
authors = ["Reattend"]
edition = "2021"

[lib]
name = "reattend_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
url = "2"

# Local embeddings (ONNX-based, no API needed)
fastembed = { version = "5", default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"] }

# Cross-platform: clipboard, active window, screenshots
# Audio recording for meeting mode
cpal = "0.15"
hound = "3.5"

arboard = "3"
active-win-pos-rs = "0.8"
tauri-plugin-updater = "2.10.0"
tauri-plugin-process = "2.3.1"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows-only: simulate keystrokes, screenshots, image processing, base64
enigo = "0.6"
xcap = "0.8"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
